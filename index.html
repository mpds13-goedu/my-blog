<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 블로그</title>
  <meta name="description" content="마크다운으로 쓰는 블로그">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/markdown.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="index.html">내 블로그</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환"></button>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title">글 목록</h1>
    <ul class="post-list" id="post-list"><li class="message">불러오는 중…</li></ul>
  </main>
  <footer class="site-footer">
    <div class="container">© 내 블로그</div>
  </footer>
</body>
</html>
